name: apache-nifi

services:
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    restart: "no"
    ports:
      - "8443:8443"  # Accederás en https://localhost:8443/nifi
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin123456789
      - TZ=America/Bogota
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_python:/opt/nifi/nifi-current/python_extensions
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_nar:/opt/nifi/nifi-current/nar_extensions
      - nifi_logs:/opt/nifi/nifi-current/logs
    networks:
      - red-principal

volumes:
  nifi_conf:
    name: apache-nifi_nifi_conf
    external: true
  nifi_state:
    name: apache-nifi_nifi_state
    external: true
  nifi_content:
    name: apache-nifi_nifi_content
    external: true
  nifi_provenance:
    name: apache-nifi_nifi_provenance
    external: true
  nifi_database:
    name: apache-nifi_nifi_database
    external: true
  nifi_python:
    name: apache-nifi_nifi_python
    external: true
  nifi_flowfile:
    name: apache-nifi_nifi_flowfile
    external: true
  nifi_nar:
    name: apache-nifi_nifi_nar
    external: true
  nifi_logs:
    name: apache-nifi_nifi_logs
    external: true

networks:
  red-principal:
    external: true
