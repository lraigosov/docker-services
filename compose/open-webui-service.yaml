name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: "no"
    ports:
      - "3100:8080"
    environment:
      OLLAMA_BASE_URLS: http://qwen3-coder:11434;http://qwen3:11434
      WEBUI_AUTH: "True"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - red-principal

volumes:
  open_webui_data:
    name: open-webui_open_webui_data
    external: true

networks:
  red-principal:
    external: true