name: cassandra

services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra-server
    restart: "no"
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-docker-services-cluster}
      CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-512M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-100M}
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - red-principal

volumes:
  cassandra_data:
    name: cassandra_cassandra_data
    external: true

networks:
  red-principal:
    external: true
