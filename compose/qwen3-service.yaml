name: qwen3

services:
  qwen3:
    image: ollama/ollama:latest
    container_name: qwen3
    restart: "no"
    ports:
      - "0.0.0.0:11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    cpus: "4.0"
    mem_limit: 16g
    memswap_limit: 20g
    shm_size: 1g
    volumes:
      - qwen3_models:/root/.ollama
    networks:
      - red-principal

  qwen3-init:
    image: ollama/ollama:latest
    container_name: qwen3_init
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - until ollama list >/dev/null 2>&1; do echo 'Esperando al servidor de Qwen3...'; sleep 5; done; ollama pull "$${QWEN3_MODEL}"
    depends_on:
      - qwen3
    environment:
      OLLAMA_HOST: http://qwen3:11434
      QWEN3_MODEL: ${QWEN3_MODEL:-qwen3:latest}
    volumes:
      - qwen3_models:/root/.ollama
    networks:
      - red-principal

volumes:
  qwen3_models:
    name: qwen3_models
    external: true

networks:
  red-principal:
    external: true