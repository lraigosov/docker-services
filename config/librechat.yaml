version: 1.3.11
cache: true

interface:
  customWelcome: "LibreChat local sobre Ollama"
  modelSelect: true
  parameters: true
  prompts:
    use: true
    create: true
    share: false
    public: false

endpoints:
  custom:
    - name: "ollama-coder"
      apiKey: "ollama-local"
      baseURL: "http://qwen3-coder:11434/v1"
      models:
        default:
          - "qwen3-coder:latest"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama Coder"
      dropParams:
        - "stop"
        - "user"

    - name: "ollama-general"
      apiKey: "ollama-local"
      baseURL: "http://qwen3:11434/v1"
      models:
        default:
          - "qwen3:latest"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama General"
      dropParams:
        - "stop"
        - "user"

  allowedAddresses:
    - "qwen3-coder:11434"
    - "qwen3:11434"
